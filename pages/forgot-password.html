<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Naji - Reset Password</title>
  <link rel="stylesheet" href="../css/base.css?v=20260924i" />
  <link rel="stylesheet" href="../css/components.css?v=20260924i" />
  <link rel="stylesheet" href="../css/pages/login.css?v=20260924i" />
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
  <div id="navbar-mount"></div>

  <main class="container auth-page">
    <div id="app" class="card auth-card">
      <form v-if="step === 'request'" class="auth-form" @submit.prevent="handleRequest">
        <h2>Reset your password</h2>
        <p class="text-muted">Enter the email on your account and choose a new password. We'll email you a code to confirm it.</p>

        <label class="form-field">
          <span>Email</span>
          <input type="email" v-model.trim="form.email" autocomplete="email" />
        </label>

        <label class="form-field">
          <span>New password</span>
          <password-field v-model="form.newPassword" autocomplete="new-password" show-rules />
        </label>

        <label class="form-field">
          <span>Confirm new password</span>
          <password-field v-model="form.newPasswordAgain" autocomplete="new-password" :match-with="form.newPassword" />
        </label>

        <button type="submit" class="btn btn-primary" :class="{ 'is-loading': isBusy }" :disabled="isBusy">
          {{ isBusy ? "Sending code..." : "Send verification code" }}
        </button>
        <a class="auth-form__link" href="/pages/login.html">Back to sign in</a>
      </form>

      <form v-else class="auth-form" @submit.prevent="handleVerify">
        <h2>Check your email</h2>
        <p class="text-muted">We sent a verification code to <strong>{{ form.email }}</strong>. It expires in 5 minutes.</p>

        <label class="form-field">
          <span>Verification code</span>
          <input type="text" v-model.trim="code" autocomplete="one-time-code" />
        </label>

        <button type="submit" class="btn btn-primary" :class="{ 'is-loading': isBusy }" :disabled="isBusy">
          {{ isBusy ? "Verifying..." : "Verify and reset" }}
        </button>
        <button type="button" class="btn btn-secondary" :disabled="isBusy" @click="step = 'request'">Back</button>
      </form>
    </div>
  </main>

  <script src="../js/utils/storage.js?v=20260924i"></script>
  <script src="../js/utils/toast.js?v=20260924i"></script>
  <script src="../js/utils/dom.js?v=20260924i"></script>
  <script src="../js/api/client.js?v=20260924i"></script>
  <script src="../js/api/auth.js?v=20260924i"></script>
  <script src="../js/components/password-field.js?v=20260924i"></script>
  <script>
    Naji.dom.loadNavbar("#navbar-mount");

    const { createApp } = Vue;

    const app = createApp({
      data() {
        return {
          step: "request",
          isBusy: false,
          code: "",
          form: { email: "", newPassword: "", newPasswordAgain: "" }
        };
      },
      methods: {
        async handleRequest() {
          const { email, newPassword, newPasswordAgain } = this.form;
          if (!email || !newPassword || !newPasswordAgain) {
            Naji.toast.error("Please fill in your email and both password fields.");
            return;
          }

          const problem = Naji.validation.emailMessage(email)
            || Naji.validation.firstUnmetPasswordMessage(newPassword)
            || Naji.validation.confirmationMessage(newPassword, newPasswordAgain);
          if (problem) {
            Naji.toast.error(problem);
            return;
          }

          this.isBusy = true;
          try {
            await Naji.auth.requestPasswordReset(this.form);
            this.code = "";
            this.step = "verify";
            Naji.toast.success("Verification code sent. Check your email.");
          } catch (error) {
            Naji.toast.error(error.message || "Unable to start the password reset.");
          } finally {
            this.isBusy = false;
          }
        },
        async handleVerify() {
          if (!this.code) {
            Naji.toast.error("Please enter the verification code.");
            return;
          }

          this.isBusy = true;
          try {
            await Naji.auth.verifyPasswordReset(this.form.email, this.code);
            window.location.href = "/pages/login.html?reset=1";
          } catch (error) {
            Naji.toast.error(error.message || "Unable to verify that code.");
            this.isBusy = false;
          }
        }
      }
    });

    app.component("password-field", Naji.components.PasswordField);
    app.mount("#app");
  </script>
</body>
</html>
