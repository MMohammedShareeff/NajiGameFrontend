<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Naji - Dashboard</title>
  <link rel="stylesheet" href="../css/base.css?v=20260925i" />
  <link rel="stylesheet" href="../css/components.css?v=20260925i" />
  <link rel="stylesheet" href="../css/pages/dashboard.css?v=20260925i" />
  <link rel="stylesheet" href="../css/rtl.css?v=20260925i" />
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="../js/i18n/i18n.js?v=20260925i"></script>
  <script src="../js/i18n/ar.js?v=20260925i"></script>
</head>
<body>
  <div id="navbar-mount"></div>

  <main class="dashboard-page">
    <div id="app">
      <div class="dashboard-header">
        <h1 class="page-title">{{ username }}</h1>
        <p class="page-sub">[ Your game stats &amp; survival ratios ]</p>
      </div>

      <p v-if="isLoading" class="dashboard-empty">Loading your stats...</p>
      <p v-else-if="loadError" class="form-error dashboard-empty">{{ loadError }}</p>

      <template v-else>
        <div class="stat-grid">
          <section v-for="(stat, index) in stats" :key="stat.label" class="panel stat-card" :class="{ 'stat-card--wide': stat.wide }">
            <span class="stat-card__code">0{{ index + 1 }} // {{ stat.code }}</span>
            <span class="stat-card__label">{{ stat.label }}</span>
            <span class="stat-card__value">{{ stat.value }}</span>
            <span v-if="stat.percent !== undefined" class="stat-card__bar"><i :style="{ width: stat.percent + '%' }"></i></span>
            <span class="stat-card__hint">{{ stat.hint || " " }}</span>
          </section>
        </div>

        <div class="dashboard-bar">
          <span class="dashboard-bar__status"><span class="dot"></span>Secure link established</span>
          <a class="btn btn-secondary" href="/pages/lobby.html">Re-enter lobby &gt;</a>
        </div>

        <p v-if="dashboard.totalGamesPlayed === 0" class="dashboard-empty">
          No games yet. Finish a game and your stats will show up here.
        </p>
      </template>
    </div>
  </main>

  <script src="../js/utils/storage.js?v=20260925i"></script>
  <script src="../js/utils/dom.js?v=20260925i"></script>
  <script src="../js/api/client.js?v=20260925i"></script>
  <script src="../js/utils/toast.js?v=20260925i"></script>
  <script src="../js/api/invite.js?v=20260925i"></script>
  <script src="../js/utils/invites.js?v=20260925i"></script>
  <script src="../js/api/auth.js?v=20260925i"></script>
  <script src="../js/utils/auth-guard.js?v=20260925i"></script>
  <script src="../js/api/dashboard.js?v=20260925i"></script>
  <script>
    if (Naji.authGuard.requireAccount()) {
      Naji.dom.loadNavbar("#navbar-mount");

      const { createApp } = Vue;

      createApp({
        data() {
          return {
            username: Naji.storage.getUsername(),
            dashboard: null,
            isLoading: true,
            loadError: ""
          };
        },
        computed: {
          stats() {
            const d = this.dashboard;
            const winRate = d.totalGamesPlayed ? Math.round((d.totalGamesWon / d.totalGamesPlayed) * 100) : 0;
            return [
              { code: "MISSION_COUNT", label: "Games played", value: d.totalGamesPlayed, hint: "Logged sessions" },
              { code: "VICTORIES", label: "Games won", value: d.totalGamesWon, hint: `${winRate}% win rate`, percent: winRate },
              { code: "CASUALTIES", label: "Games lost", value: d.totalGamesLost, hint: "Defeat index" },
              { code: "STALEMATES", label: "Games drawn", value: d.totalGamesDrawn, hint: "Parity sessions" },
              { code: "MOMENTUM", label: "Win streak", value: d.winStreak, hint: "Current chain" },
              { code: "PEAK_RECORD", label: "Best game score", value: d.highestScore.toFixed(0), hint: "Total across all rounds" },
              { code: "STATISTICAL_MEAN", label: "Average game score", value: d.averageScorePerRound.toFixed(1), hint: "Total across all rounds", wide: true }
            ];
          }
        },
        async mounted() {
          try {
            this.dashboard = await Naji.dashboard.getMyDashboard();
          } catch (error) {
            this.loadError = error.message || "Unable to load your stats.";
          } finally {
            this.isLoading = false;
          }
        }
      }).mount("#app");
    }
  </script>
</body>
</html>
