<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Naji - Profile</title>
  <link rel="stylesheet" href="../css/base.css?v=20260924e" />
  <link rel="stylesheet" href="../css/components.css?v=20260924e" />
  <link rel="stylesheet" href="../css/pages/profile.css?v=20260924e" />
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
  <div id="navbar-mount"></div>

  <main class="profile-page">
    <div id="app">
      <div v-if="loadError" class="card state-card">
        <h2>Couldn't load your profile</h2>
        <p>{{ loadError }}</p>
        <div class="state-card__actions">
          <button type="button" class="btn btn-primary" @click="loadProfile">Try again</button>
        </div>
      </div>

      <p v-else-if="!profile" class="profile-hint" style="text-align: center; color: var(--color-text-muted)">
        Loading your profile...
      </p>

      <template v-else>
        <div class="profile-header">
          <h1 class="gradient-text">{{ profile.userName }}</h1>
          <p>Your account</p>
        </div>

        <form v-if="step === 'edit'" class="card profile-card" @submit.prevent="handleSave">
          <h2>Edit your details</h2>

          <div class="profile-form">
            <label class="form-field">
              <span>Username</span>
              <input type="text" v-model.trim="form.userName" autocomplete="username" />
            </label>

            <label class="form-field">
              <span>Email</span>
              <input type="email" v-model.trim="form.email" autocomplete="email" />
            </label>

            <label class="form-field">
              <span>New password</span>
              <password-field
                v-model="form.password"
                autocomplete="new-password"
                placeholder="Leave blank to keep your current password"
                show-rules
              />
            </label>

            <label class="form-field">
              <span>Confirm new password</span>
              <password-field
                v-model="form.confirmPassword"
                autocomplete="new-password"
                placeholder="Type the new password again"
                :match-with="form.password"
                :disabled="!form.password"
              />
            </label>
          </div>

          <p class="profile-hint">
            Saving sends a verification code to your current email. If you change your email, a second code goes to the new address before anything is applied.
          </p>

          <div class="profile-actions">
            <button type="submit" class="btn btn-primary" :class="{ 'is-loading': isSaving }" :disabled="isSaving">
              {{ isSaving ? "Sending code..." : "Save changes" }}
            </button>
          </div>
        </form>

        <form v-else class="card profile-card" @submit.prevent="handleVerify">
          <p v-if="totalVerifySteps > 1" class="profile-step">Step {{ verifyStep }} of {{ totalVerifySteps }}</p>
          <h2>{{ verifyStep === 2 ? "Confirm your new email" : "Confirm it's you" }}</h2>
          <p v-if="verifyStep === 1">
            To protect your account, we sent a verification code to your current email
            <strong>{{ profile.email }}</strong>. It expires in 10 minutes.
          </p>
          <p v-else>
            Now we sent a second code to your new email <strong>{{ pendingEmail }}</strong>
            to make sure it's yours. It expires in 10 minutes.
          </p>

          <label class="form-field">
            <span>Verification code</span>
            <input type="text" v-model.trim="code" autocomplete="one-time-code" />
          </label>

          <div class="profile-actions">
            <button type="submit" class="btn btn-primary" :class="{ 'is-loading': isVerifying }" :disabled="isVerifying">
              {{ isVerifying ? "Verifying..." : verifyStep < totalVerifySteps ? "Verify and continue" : "Verify and apply" }}
            </button>
            <button type="button" class="btn btn-secondary" :disabled="isVerifying" @click="cancelVerification">
              Cancel
            </button>
          </div>
        </form>
      </template>
    </div>
  </main>

  <script src="../js/utils/storage.js?v=20260924e"></script>
  <script src="../js/utils/toast.js?v=20260924e"></script>
  <script src="../js/utils/dom.js?v=20260924e"></script>
  <script src="../js/api/client.js?v=20260924e"></script>
  <script src="../js/api/invite.js?v=20260924e"></script>
  <script src="../js/utils/invites.js?v=20260924e"></script>
  <script src="../js/api/auth.js?v=20260924e"></script>
  <script src="../js/utils/auth-guard.js?v=20260924e"></script>
  <script src="../js/api/profile.js?v=20260924e"></script>
  <script src="../js/components/password-field.js?v=20260924e"></script>
  <script>
    if (Naji.authGuard.requireAccount()) {
      Naji.dom.loadNavbar("#navbar-mount");

      const { createApp } = Vue;

      const app = createApp({
        data() {
          return {
            profile: null,
            loadError: "",
            step: "edit",
            form: { userName: "", email: "", password: "", confirmPassword: "" },
            pendingEmail: "",
            pendingUsernameChange: false,
            verifyStep: 1,
            totalVerifySteps: 1,
            code: "",
            isSaving: false,
            isVerifying: false
          };
        },
        mounted() {
          this.loadProfile();
        },
        methods: {
          async loadProfile() {
            this.loadError = "";
            try {
              this.profile = await Naji.profile.getMyProfile();
              this.form = { userName: this.profile.userName, email: this.profile.email, password: "", confirmPassword: "" };
            } catch (error) {
              this.loadError = error.message || "Something went wrong while loading your profile.";
            }
          },
          validationMessage(changes) {
            return (changes.userName && Naji.validation.usernameMessage(changes.userName))
              || Naji.validation.emailMessage(this.form.email)
              || (changes.password && Naji.validation.firstUnmetPasswordMessage(changes.password))
              || (changes.password && Naji.validation.confirmationMessage(changes.password, this.form.confirmPassword))
              || (!changes.password && this.form.confirmPassword && "Enter your new password first, then confirm it.")
              || "";
          },
          async handleSave() {
            const changes = {
              userName: this.form.userName !== this.profile.userName ? this.form.userName : "",
              email: this.form.email,
              password: this.form.password
            };

            if (!changes.userName && changes.email === this.profile.email && !changes.password && !this.form.confirmPassword) {
              Naji.toast.info("There is nothing to save yet.");
              return;
            }

            const problem = this.validationMessage(changes);
            if (problem) {
              Naji.toast.error(problem);
              return;
            }

            this.isSaving = true;
            try {
              await Naji.profile.requestUpdate(changes);
              this.pendingEmail = changes.email;
              this.pendingUsernameChange = Boolean(changes.userName);
              this.verifyStep = 1;
              this.totalVerifySteps = changes.email.toLowerCase() !== this.profile.email.toLowerCase() ? 2 : 1;
              this.code = "";
              this.step = "verify";
              Naji.toast.success("Verification code sent to your current email.");
            } catch (error) {
              Naji.toast.error(error.message || "Unable to save your changes.");
            } finally {
              this.isSaving = false;
            }
          },
          async handleVerify() {
            if (!this.code) {
              Naji.toast.error("Please enter the verification code.");
              return;
            }

            this.isVerifying = true;
            try {
              const outcome = await Naji.profile.verifyUpdate(this.code);
              if (outcome === "NEW_EMAIL_CODE_SENT") {
                this.verifyStep = 2;
                this.code = "";
                this.isVerifying = false;
                Naji.toast.success(`Code sent to ${this.pendingEmail}.`);
                return;
              }
            } catch (error) {
              Naji.toast.error(error.message || "Unable to verify that code.");
              this.isVerifying = false;
              return;
            }

            if (this.pendingUsernameChange) {
              Naji.storage.clearSession();
              window.location.href = "/pages/login.html?renamed=1";
              return;
            }

            Naji.toast.success("Your profile was updated.");
            this.step = "edit";
            this.isVerifying = false;
            await this.loadProfile();
          },
          cancelVerification() {
            this.step = "edit";
            this.code = "";
          }
        }
      });

      app.component("password-field", Naji.components.PasswordField);
      app.mount("#app");
    }
  </script>
</body>
</html>
