<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Naji - Sign In</title>
  <link rel="stylesheet" href="../css/base.css?v=20260924b" />
  <link rel="stylesheet" href="../css/components.css?v=20260924b" />
  <link rel="stylesheet" href="../css/pages/login.css?v=20260924b" />
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
  <div id="navbar-mount"></div>

  <main class="container auth-page">
    <div id="app" class="card auth-card">
      <div class="auth-tabs">
        <button
          type="button"
          class="auth-tabs__btn"
          :class="{ 'auth-tabs__btn--active': activeTab === 'login' }"
          @click="activeTab = 'login'"
        >Login</button>
        <button
          type="button"
          class="auth-tabs__btn"
          :class="{ 'auth-tabs__btn--active': activeTab === 'signup' }"
          @click="activeTab = 'signup'"
        >Sign Up</button>
      </div>

      <form v-if="activeTab === 'login'" class="auth-form" @submit.prevent="handleLogin">
        <h2>Welcome back</h2>

        <label class="form-field">
          <span>Username</span>
          <input type="text" v-model.trim="loginForm.userName" autocomplete="username" />
        </label>

        <label class="form-field">
          <span>Password</span>
          <password-field v-model="loginForm.password" autocomplete="current-password" />
        </label>

        <button type="submit" class="btn btn-primary" :class="{ 'is-loading': isSubmitting }" :disabled="isSubmitting">
          {{ isSubmitting ? "Signing in..." : "Sign In" }}
        </button>
        <a class="auth-form__link" href="/pages/forgot-password.html">Forgot your password?</a>
      </form>

      <form v-else class="auth-form" @submit.prevent="handleSignup">
        <h2>Create your account</h2>

        <label class="form-field">
          <span>Username</span>
          <input type="text" v-model.trim="signupForm.userName" autocomplete="username" />
        </label>

        <label class="form-field">
          <span>Email</span>
          <input type="email" v-model.trim="signupForm.email" autocomplete="email" />
        </label>

        <label class="form-field">
          <span>Password</span>
          <password-field v-model="signupForm.password" autocomplete="new-password" show-rules />
        </label>

        <label class="form-field">
          <span>Confirm password</span>
          <password-field v-model="signupForm.confirmPassword" autocomplete="new-password" :match-with="signupForm.password" />
        </label>

        <button type="submit" class="btn btn-primary" :class="{ 'is-loading': isSubmitting }" :disabled="isSubmitting">
          {{ isSubmitting ? "Creating account..." : "Register Today!" }}
        </button>
      </form>

      <div class="auth-divider"><span>or</span></div>

      <label class="form-field auth-guest__name">
        <span>Guest nickname (optional)</span>
        <input type="text" v-model.trim="guestName" maxlength="20" placeholder="Leave empty for a random name" autocomplete="off" @keyup.enter="handleGuest" />
      </label>

      <button type="button" class="btn btn-secondary auth-guest" :class="{ 'is-loading': isGuestLoading }" :disabled="isSubmitting || isGuestLoading" @click="handleGuest">
        {{ isGuestLoading ? "Setting up..." : "Play as guest" }}
      </button>
      <p class="text-muted auth-guest__hint">Your nickname is how friends spot you in the room. No stats are kept.</p>
    </div>
  </main>

  <script src="../js/utils/storage.js?v=20260924b"></script>
  <script src="../js/utils/toast.js?v=20260924b"></script>
  <script src="../js/utils/dom.js?v=20260924b"></script>
  <script src="../js/api/client.js?v=20260924b"></script>
  <script src="../js/api/auth.js?v=20260924b"></script>
  <script src="../js/components/password-field.js?v=20260924b"></script>
  <script>
    Naji.dom.loadNavbar("#navbar-mount");

    const { createApp } = Vue;

    const app = createApp({
      data() {
        return {
          activeTab: "login",
          isSubmitting: false,
          isGuestLoading: false,
          guestName: "",
          loginForm: { userName: "", password: "" },
          signupForm: { userName: "", email: "", password: "", confirmPassword: "" }
        };
      },
      mounted() {
        const params = new URLSearchParams(window.location.search);
        if (params.get("expired")) {
          Naji.toast.info("Your session expired. Please sign in again.");
        }
        if (params.get("reset")) {
          Naji.toast.success("Password updated. Sign in with your new password.");
        }
        if (params.get("renamed")) {
          Naji.toast.success("Username updated. Please sign in with your new username.");
        }
      },
      methods: {
        async handleGuest() {
          const problem = Naji.validation.nicknameMessage(this.guestName);
          if (problem) {
            Naji.toast.error(problem);
            return;
          }

          this.isGuestLoading = true;
          try {
            await Naji.auth.loginAsGuest(this.guestName);
            window.location.href = "/pages/lobby.html";
          } catch (error) {
            Naji.toast.error(error.message || "Unable to start a guest session.");
            this.isGuestLoading = false;
          }
        },
        async handleLogin() {
          if (!this.loginForm.userName || !this.loginForm.password) {
            Naji.toast.error("Please enter your username and password.");
            return;
          }

          this.isSubmitting = true;
          try {
            await Naji.auth.login({
              userName: this.loginForm.userName,
              password: this.loginForm.password
            });
            window.location.href = "/pages/lobby.html";
          } catch (error) {
            Naji.toast.error(error.message || "Unable to sign in.");
          } finally {
            this.isSubmitting = false;
          }
        },
        async handleSignup() {
          const { userName, email, password, confirmPassword } = this.signupForm;
          if (!userName || !email || !password || !confirmPassword) {
            Naji.toast.error("Please fill in username, email, and both password fields.");
            return;
          }
          const problem = Naji.validation.usernameMessage(userName)
            || Naji.validation.emailMessage(email)
            || Naji.validation.firstUnmetPasswordMessage(password)
            || Naji.validation.confirmationMessage(password, confirmPassword);
          if (problem) {
            Naji.toast.error(problem);
            return;
          }

          this.isSubmitting = true;
          try {
            await Naji.auth.register({ userName, email, password });
            Naji.toast.success("Account created. Check your email to verify before signing in.");
            this.signupForm = { userName: "", email: "", password: "", confirmPassword: "" };
            this.activeTab = "login";
          } catch (error) {
            Naji.toast.error(error.message || "Unable to register.");
          } finally {
            this.isSubmitting = false;
          }
        }
      }
    });

    app.component("password-field", Naji.components.PasswordField);
    app.mount("#app");
  </script>
</body>
</html>
